# pastry-pilot#20 — which one-time setup is done, checked against the real GitHub and Supabase state.
# Prints only set/missing, HTTP codes and non-secret settings, never secret values. Run it from the
# Actions tab any time. It also runs every Monday and when this file changes in a PR (never on
# Auto-Pilot branches, because it holds the Supabase token).
name: YEON OS setup status

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 21 * * 0" # Monday 08:17 Sydney (AEDT)
  pull_request:
    paths: [".github/workflows/yeon-setup-status.yml"]

permissions:
  contents: read

jobs:
  status:
    if: ${{ !startsWith(github.head_ref, 'autopilot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_REF: meswjzwxldhqkjglnmzt
      APP_URL: ${{ vars.APP_URL || 'https://quriqura-kora-pilot.oompaya.workers.dev/' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      AUTOMERGE: ${{ vars.AUTOPILOT_AUTOMERGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: |
          row() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; echo "$1: $2"; }
          has() { [ -n "${!1}" ] && echo "set" || echo "**missing**"; }
          # gh prints the error body on stdout when a call fails, so use output only on success.
          get() { local out; if out=$(gh api "$1" --jq "$2" 2>/dev/null) && [ -n "$out" ] && [ "$out" != "null" ]; then echo "$out"; else echo ""; fi; }
          {
            echo "### YEON OS setup status ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo "| Item | State |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then row "Claude credentials" set; else row "Claude credentials" "**missing**"; fi
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            row "Secret $s" "$(has "$s")"
          done
          if [ -n "$SUPABASE_PROJECT_ID" ]; then
            [ "$SUPABASE_PROJECT_ID" = "$EXPECTED_REF" ] && row "SUPABASE_PROJECT_ID is the Business project" yes || row "SUPABASE_PROJECT_ID is the Business project" "**no**"
          fi

          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$EXPECTED_REF" || echo 000)
            row "Supabase Management API access" "HTTP $code"
            # Read-only: connection, migration history, ledger and pending files.
            if plan=$(node scripts/supabase-migrate.mjs plan 2>&1); then
              row "Database via Management API (read-only plan)" "ok"
              printf '\n```\n%s\n```\n\n' "$plan" >> "$GITHUB_STEP_SUMMARY"
            else
              row "Database via Management API (read-only plan)" "**failed**: $(printf '%s' "$plan" | tail -1 | cut -c1-200)"
            fi
            # Live JWT setting of each PILOT function vs. the pin in supabase/config.toml.
            live=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$EXPECTED_REF/functions" \
              | jq -r '.[] | "\(.slug)=\(.verify_jwt)"' 2>/dev/null || true)
            for f in $(grep -oE '^\[functions\.[a-z0-9-]+\]' supabase/config.toml | sed 's/\[functions\.//; s/\]//'); do
              pin=$(awk -v f="[functions.$f]" '$0==f{getline; print $3}' supabase/config.toml)
              cur=$(printf '%s\n' "$live" | grep -E "^$f=" | cut -d= -f2)
              if [ -z "$cur" ]; then row "Function $f" "not deployed yet (pin verify_jwt=$pin)"
              elif [ "$cur" = "$pin" ]; then row "Function $f" "live, verify_jwt=$cur matches pin"
              else row "Function $f" "**live verify_jwt=$cur, pin says $pin**"; fi
            done
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL" || echo 000)
          row "App address $APP_URL" "HTTP $code"

          r=$(get "repos/$GITHUB_REPOSITORY/environments/production" '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ -z "$r" ]; then row "Environment production" "**missing** (high-risk DB/function deploys are refused until it exists)"
          elif [ "$r" = "0" ]; then row "Environment production" "**exists without required reviewer**"
          else row "Environment production" "exists, required reviewer set"; fi
          perm=$(get "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" '"\(.default_workflow_permissions), can_approve_pull_request_reviews=\(.can_approve_pull_request_reviews)"')
          row "Actions may create PRs" "${perm:-unverified (this token cannot read it; confirmed by the first Auto-Pilot PR)}"
          prot=$(get "repos/$GITHUB_REPOSITORY/branches/main" .protected)
          row "main branch protected" "${prot:-unverified}"
          row "Variable AUTOPILOT_AUTOMERGE" "${AUTOMERGE:-unset (auto-merge off)}"
