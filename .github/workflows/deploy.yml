# 2026-10-20 사용자 요청: Lovable의 "push → 자동 빌드/배포" 대신, 이 레포 자체에서 push할 때마다
# Cloudflare Workers로 직접 빌드+배포한다("러버블 통하는거 번거로워.. 자동화 세팅하자").
# 빌드는 nitro(이 프로젝트의 cloudflare-module preset)가 .output/server/wrangler.json을
# 자동 생성하고, 그 워커 이름은 git remote에서 도출된다.
# 2026-11-16: 레포 이름이 kora-pilot → pastry-pilot으로 바뀐 뒤 자동 이름이 "quriqura-pastry-pilot"이 되어
# 새 워커로 배포되고, 로그인해 쓰던 "quriqura-kora-pilot" 주소는 예전 빌드에 멈춰 있었다.
# 그래서 배포할 워커 이름을 --name으로 고정한다(레포 이름과 무관하게 늘 같은 주소).
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-11-08: setup-bun은 GitHub 릴리스(zip)를 내려받는데 그쪽이 504로 막혀 배포가 실패해서,
      # npm 레지스트리 경유 설치로 바꿨다(같은 bun 바이너리, 다른 다운로드 경로).
      - run: npm install -g bun

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - run: bunx wrangler deploy --config .output/server/wrangler.json --name quriqura-kora-pilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
